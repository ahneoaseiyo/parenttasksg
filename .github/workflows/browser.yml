name: Browser smoke tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser tests
        run: npx --no-install playwright test tests/browser.spec.js --reporter=line
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
